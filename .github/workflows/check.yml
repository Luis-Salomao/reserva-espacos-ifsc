# Mesmo gate do pre-push (bun run check), rodado no GitHub a cada push e pull request.
# A varredura de segredos (Betterleaks) roda nos ganchos locais de pre-commit e pre-push.
name: Verificação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Biome (formatação e lint)
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Código não usado (knip)
        run: bun run knip

      - name: Regras de arquitetura (dependency-cruiser)
        run: bun run deps

      - name: Testes e cobertura
        run: bun run test:coverage
