[test]
preload = ["./test/setup-dom.ts"]
coverageReporter = ["text", "lcov"]
coverageThreshold = { lines = 0.9, functions = 0.9 }
coverageSkipTestFiles = true
# Escopo da cobertura: só domain, application, import-asc e infra (Task 4+).
# Bun só mede arquivos carregados pelos testes; o resto é ignorado explicitamente.
coveragePathIgnorePatterns = [
  "test/**",
  "src/components/**",
  "src/routes/**",
  "src/integrations/**",
  "src/lib/**",
  # Server function que só delega ao repositório (ligado ao banco via #db-client); sem lógica própria.
  "src/server/spaces.ts",
  # Ligação das funções de servidor da administração; lógica e controle de acesso ficam em admin-actions.ts (testado).
  "src/server/admin.ts",
  # Ligação das funções de servidor da importação (carregada pelos testes de componentes); a lógica fica em import-actions.ts e import-flow.ts (testados).
  "src/server/import-fns.ts",
  "src/server/import-deps.ts",
  # Ligação das funções de servidor da agenda e das reservas; lógica e acesso ficam em booking-actions.ts (testado).
  "src/server/booking-fns.ts",
  "src/server/booking-deps.ts",
  "src/server/auth-context.ts",
  # Ligação dos avisos e pedidos de sala; lógica e acesso ficam em notification-actions.ts e nos serviços (testados).
  "src/server/notification-fns.ts",
  "src/server/notification-deps.ts",
  "src/server/notices-context.ts",
  # Composição e wrappers do Start; regras de recuperação ficam em password-recovery/actions, testadas.
  "src/server/password-recovery-context.ts",
  "src/server/password-recovery-fns.ts",
  "src/server/finish.ts",
  "src/router.tsx",
  "src/routeTree.gen.ts",
  # Depende de cloudflare:workers; só roda dentro do Worker.
  "src/infra/db/client.cloudflare.ts",
  # CLI: só a lógica pura (cli/init-plan.ts) é medida; o restante é IO (prompts, spawn, escrita).
  "cli/index.ts",
  "cli/init.ts",
  "cli/create-admin.ts",
  "cli/backup.ts",
  "cli/restore.ts",
  "cli/import-preview.ts",
  "cli/db-migrate.ts",
  "cli/check-wrangler.ts",
  "cli/check-env.ts",
  "drizzle/**",
  "**/*.test.ts",
  "**/*.test.tsx",
]
